# fly.toml app configuration file generated for discord-event-manager on 2026-07-22T16:16:56Z
#
# See https://fly.io/docs/reference/configuration/ for information about how to use this file.
#

app = 'discord-event-manager'
primary_region = 'iad'

[build]

[[mounts]]
  source = 'event_bot_data'
  destination = '/data'

# Deliberately NO [http_service] / [[services]] block. This bot
# doesn't listen on any port — it only opens an outbound WebSocket to
# Discord's gateway. Without a services block, Fly just runs the
# machine continuously with no traffic-based auto-stop/start logic
# involved at all.

# If the process crashes (uncaught error, OOM, etc.), restart it
# automatically instead of leaving the bot offline until you notice.
[[restart]]
  policy = 'always'

[[vm]]
  size = 'shared-cpu-1x'
  memory = '512mb'